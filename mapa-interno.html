<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/mapa.css">
  </head>
  <body class="map-page" data-mapa="interno">
    <header id="header">
      <nav class="nav-container" aria-label="Principal">
        <a class="logo" href="index.html"><img src="img/arise.png" alt="" width="38" height="38"><span>A.R.I.S.E</span></a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Abrir menú"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="index.html#about-us">Sobre nosotros</a></li>

        <ul id="places-list" class="places-list"></ul>
      </aside>
      <div id="map" role="region" aria-label="Mapa"></div>
    </main>
    <script src="https://kit.fontawesome.com/2b7f4aa298.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
